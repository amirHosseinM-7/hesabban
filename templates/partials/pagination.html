{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  {% if page.has_previous %}
  <a class="btn btn-sm" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page.previous_page_number }}">قبلی</a>
  {% endif %}
  <span class="page-info">صفحه {{ page.number|floatformat:0 }} از {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
  <a class="btn btn-sm" href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page.next_page_number }}">بعدی</a>
  {% endif %}
</div>
{% endif %}
